name: Rust build & release

on:
  push:
    branches: [main, rust-rewrite]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: notika
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: notika.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: notika
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend (embedded into the binary)
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Registers rustc problem matchers so compile errors show up as annotations.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          rustflags: ''

      - name: cargo build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: cargo test
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Smoke test API
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euxo pipefail
          export DATA_DIR=$(mktemp -d) PORT=3999
          ./target/${{ matrix.target }}/release/notika &
          for i in $(seq 1 30); do curl -sf localhost:3999/api/health && break; sleep 1; done
          B=localhost:3999/api
          curl -sf $B/health | grep -q '"ok":true'
          curl -sf localhost:3999/ | grep -qi '<div id="root">'
          curl -sf -X POST $B/projects -H 'content-type: application/json' -d '{"name":"Smoke"}' | grep -q '"Smoke"'
          curl -sf -X POST $B/notes -H 'content-type: application/json' -d '{"project":"Smoke","name":"hello","content":"# Merhaba dünya"}' | grep -q 'hello'
          curl -sf "$B/notes?project=Smoke&note=hello.md" | grep -q 'Merhaba'
          curl -sf -X PUT $B/notes -H 'content-type: application/json' -d '{"project":"Smoke","name":"hello.md","content":"guncel icerik"}' | grep -q 'guncel'
          curl -sf "$B/search?q=guncel" | grep -q 'hello'
          curl -sf $B/tree | grep -q 'Smoke'
          curl -sf -X DELETE "$B/notes?project=Smoke&note=hello.md" | grep -q '"ok":true'
          curl -sf $B/trash | grep -q 'hello'
          ls -R "$DATA_DIR"
          kill %1

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} out/
          cp README.md LICENSE .env.example out/
          cd out
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../notika-${{ matrix.target }}.zip .
          else
            tar czf ../notika-${{ matrix.target }}.tar.gz .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: notika-${{ matrix.target }}
          path: notika-${{ matrix.target }}.*

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
