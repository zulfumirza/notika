name: Rust build & release

on:
  push:
    branches: [main, rust-rewrite]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: notika
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: notika.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: notika
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend (embedded into the binary)
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: cargo test
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} out/
          cp README.md LICENSE .env.example out/
          cd out
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../notika-${{ matrix.target }}.zip .
          else
            tar czf ../notika-${{ matrix.target }}.tar.gz .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: notika-${{ matrix.target }}
          path: notika-${{ matrix.target }}.*

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
