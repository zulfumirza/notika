[package]
name = "notika"
version = "0.1.0"
edition = "2021"
description = "Self-hosted, database-free personal knowledge base and markdown note-taking vault"
license = "MIT"

[[bin]]
name = "notika"
path = "src-server/main.rs"

[dependencies]
# Web framework & async runtime
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "set-header"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography
hmac = "0.12"
sha2 = "0.10"
scrypt = "0.11"
rand = "0.8"
subtle = "2"
hex = "0.4"
base64 = "0.22"

# Filesystem & utilities
dunce = "1"
uuid = { version = "=1.15.1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
tempfile = "3"
percent-encoding = "2"

# Frontend embedding
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

# Logging & environment
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

# Async filesystem
tokio-util = "0.7"

# Regex for validation
regex = "1"
once_cell = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
